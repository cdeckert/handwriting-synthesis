name: HandwritingStudio

options:
  bundleIdPrefix: com.cdeckert
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0
    CODE_SIGN_STYLE: Automatic

targets:
  HandwritingStudio:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources/Models/HandwritingStep.mlpackage
      - path: Resources
        excludes:
          - Info.plist
          - Models
        buildPhase: resources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Handwriting
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cdeckert.HandwritingStudio
        PRODUCT_NAME: HandwritingStudio
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
    scheme:
      testTargets:
        - HandwritingStudioTests

  HandwritingStudioTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: HandwritingStudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cdeckert.HandwritingStudioTests
        GENERATE_INFOPLIST_FILE: YES
