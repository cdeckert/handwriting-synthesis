name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install lightweight test dependencies
        run: python -m pip install "flask>=3.0" "pytest>=8.3" "ruff>=0.11"
      - name: Check Python quality
        run: |
          ruff check web_app.py tests
          python -m compileall -q -x 'web_app/node_modules|web_app/dist' .
          pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14"
          cache: npm
          cache-dependency-path: web_app/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm audit --audit-level=high
